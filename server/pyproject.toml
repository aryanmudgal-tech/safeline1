[project]
name = "yc-voice-agent-hackathon"
version = "0.1.0"
description = "Voice AI bot built with Pipecat"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[gradium,openai,runner,silero,webrtc,websocket]>=1.3.0",
    "pipecatcloud>=0.7.1",
]

[project.optional-dependencies]
# Auto-improvement Layer 1 (semantic correction store). Optional: the
# correction store transparently falls back to token-overlap similarity when
# these aren't installed, so the bot runs without them. Install with:
#   uv sync --extra improve
improve = [
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.4",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I", "UP"]