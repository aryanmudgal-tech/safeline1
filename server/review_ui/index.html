<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Safeline — Report Review</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel-2: #1c2330;
    --border: #2d3748;
    --text: #e6edf3;
    --muted: #8b97a7;
    --accent: #3b82f6;
    --accent-2: #2563eb;
    --green: #22c55e;
    --green-bg: #0f2a1a;
    --amber: #f59e0b;
    --red: #ef4444;
    --red-bg: #2a1111;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.45;
  }
  header.topbar {
    background: linear-gradient(180deg, #11151c, #0d1117);
    border-bottom: 1px solid var(--border);
    padding: 18px 24px; position: sticky; top: 0; z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .logo {
    width: 34px; height: 34px; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), #1e40af);
    display: grid; place-items: center; font-weight: 800; color: #fff;
  }
  .brand h1 { font-size: 18px; margin: 0; letter-spacing: .2px; }
  .brand .sub { color: var(--muted); font-size: 12px; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 24px; }
  .meta { display: flex; flex-wrap: wrap; gap: 16px; color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .meta b { color: var(--text); font-weight: 600; }
  .ai-badge {
    display: flex; gap: 10px; align-items: flex-start;
    background: #13233f; border: 1px solid #1e3a63; color: #cfe0ff;
    padding: 12px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 20px;
  }
  .ai-badge .dot { font-size: 16px; line-height: 1; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; margin-bottom: 22px; overflow: hidden;
  }
  .card-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid var(--border); background: var(--panel-2);
  }
  .card-head h2 { margin: 0; font-size: 16px; }
  .pill { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; text-transform: uppercase; letter-spacing: .5px; }
  .pill.draft { background: #2a2410; color: var(--amber); border: 1px solid #4a3d12; }
  .pill.approved { background: var(--green-bg); color: var(--green); border: 1px solid #1d4a2c; }
  .fields { padding: 8px 20px 4px; }
  .field { padding: 12px 0; border-bottom: 1px solid #20262f; }
  .field:last-child { border-bottom: none; }
  .field label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .prio { font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 4px; }
  .prio.p1 { background: var(--red-bg); color: #ff9a9a; }
  .prio.p2 { background: #2a2410; color: var(--amber); }
  .prio.p3 { background: #1c2330; color: var(--muted); }
  .field input, .field textarea {
    width: 100%; background: #0d1117; color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px;
    font-size: 14px; font-family: inherit; resize: vertical;
  }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
  .field input.changed, .field textarea.changed { border-color: var(--amber); }
  .ai-original { font-size: 12px; color: var(--muted); margin-top: 5px; }
  .ai-original.missing { color: #b08; opacity: .8; }
  .card-foot { padding: 16px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  button.approve {
    background: var(--accent); color: #fff; border: none; border-radius: 9px;
    padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button.approve:hover { background: var(--accent-2); }
  button.approve:disabled { opacity: .55; cursor: default; }
  .approve-note { font-size: 13px; color: var(--muted); }
  .diff { padding: 0 20px 18px; }
  .diff h3 { font-size: 13px; color: var(--muted); margin: 8px 0; }
  .diff-row { font-size: 13px; padding: 8px 12px; background: #10151c; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; }
  .diff-row .fname { font-weight: 600; margin-bottom: 4px; }
  .diff-row .old { color: #ff9a9a; text-decoration: line-through; }
  .diff-row .new { color: var(--green); }
  .emergency {
    background: var(--red-bg); border: 1px solid #5a1c1c; color: #ffc9c9;
    padding: 18px; border-radius: 12px; font-size: 15px;
  }
  details.transcript { margin-top: 8px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; }
  details.transcript summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  details.transcript pre { white-space: pre-wrap; font-size: 13px; color: var(--text); margin-top: 12px; }
  .empty { color: var(--muted); text-align: center; padding: 60px 20px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #1c2330; border: 1px solid var(--border); padding: 12px 18px;
    border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">S</div>
      <div>
        <h1>Safeline</h1>
        <div class="sub">Police Documentation Review</div>
      </div>
    </div>
  </header>

  <div class="wrap" id="app">
    <div class="empty" id="loading">Loading reports…</div>
  </div>

  <div class="toast" id="toast"></div>

<script>
const LONG_FIELDS = new Set([
  "narrative","force_justification","subject_behavior","suspect_description",
  "disposition","evidence","witnesses","property_seized","insurance_info",
  "injuries","injuries_officer","injuries_subject","medical_attention",
  "fault_determination","subject_behavior"
]);

function qs(name) {
  return new URLSearchParams(window.location.search).get(name);
}
function esc(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
}
function titleize(s) {
  return String(s).replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
}
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2600);
}

const incidentId = qs("incident_id");

async function load() {
  const app = document.getElementById("app");
  if (!incidentId) {
    app.innerHTML = '<div class="empty">No <code>incident_id</code> in the URL.</div>';
    return;
  }
  let record;
  try {
    const res = await fetch(`/api/reports/${encodeURIComponent(incidentId)}`);
    if (!res.ok) throw new Error(await res.text());
    record = await res.json();
  } catch (e) {
    app.innerHTML = `<div class="empty">Could not load incident <b>${esc(incidentId)}</b>.<br>${esc(e.message)}</div>`;
    return;
  }
  render(record);
}

function render(record) {
  const app = document.getElementById("app");
  const officer = record.officer || {};
  const created = record.created_at ? new Date(record.created_at).toLocaleString() : "—";

  let html = `
    <div class="meta">
      <div><b>Incident</b> ${esc(record.incident_id)}</div>
      <div><b>Officer</b> ${esc(officer.name || "Badge " + (record.officer_badge || "?"))}</div>
      <div><b>Badge</b> ${esc(record.officer_badge || "—")}</div>
      <div><b>Created</b> ${esc(created)}</div>
    </div>
    <div class="ai-badge">
      <span class="dot">⚠️</span>
      <span><b>Draft generated by AI from officer verbal account.</b>
      Officer review required before filing. The original AI draft is preserved permanently for audit.</span>
    </div>`;

  if (record.is_emergency) {
    html += `<div class="emergency"><b>Session escalated.</b> This call was flagged for
      immediate supervisor attention, so no report was auto-generated.
      ${record.escalation_reason ? "Reason: " + esc(record.escalation_reason) : ""}</div>`;
    app.innerHTML = html;
    return;
  }

  const reports = record.reports || {};
  const keys = Object.keys(reports);
  if (keys.length === 0) {
    html += '<div class="empty">No reports were generated for this incident.</div>';
  }

  for (const rt of keys) {
    html += renderReport(rt, reports[rt]);
  }

  if (record.transcript) {
    html += `<details class="transcript"><summary>View source transcript (audit trail)</summary>
      <pre>${esc(record.transcript)}</pre></details>`;
  }

  app.innerHTML = html;

  for (const rt of keys) wireReport(rt, reports[rt]);
}

function renderReport(rt, report) {
  const tpl = report.template || [];
  const draft = report.ai_draft || {};
  const current = report.officer_version || {};
  const approved = report.approved;

  let fieldsHtml = "";
  for (const spec of tpl) {
    const f = spec.field;
    const val = current[f];
    const aiVal = draft[f];
    const long = LONG_FIELDS.has(f) || (typeof val === "string" && val.length > 60);
    const inputId = `${rt}__${f}`;
    const valStr = (val === null || val === undefined) ? "" : (typeof val === "object" ? JSON.stringify(val) : val);
    const control = long
      ? `<textarea id="${inputId}" data-field="${f}" rows="3" placeholder="Not captured — add if known">${esc(valStr)}</textarea>`
      : `<input id="${inputId}" data-field="${f}" value="${esc(valStr)}" placeholder="Not captured — add if known" />`;

    const aiStr = (aiVal === null || aiVal === undefined)
      ? `<span class="ai-original missing">AI did not capture this field</span>`
      : `<span class="ai-original">AI draft: ${esc(typeof aiVal === "object" ? JSON.stringify(aiVal) : aiVal)}</span>`;

    fieldsHtml += `
      <div class="field">
        <label>${esc(spec.label || titleize(f))}
          <span class="prio p${spec.priority || 2}">P${spec.priority || 2}</span>
        </label>
        ${control}
        ${aiStr}
      </div>`;
  }

  return `
    <div class="card" id="card-${rt}">
      <div class="card-head">
        <h2>${titleize(rt)}</h2>
        <span class="pill ${approved ? "approved" : "draft"}" id="pill-${rt}">${approved ? "Approved" : "Draft"}</span>
      </div>
      <div class="fields">${fieldsHtml}</div>
      <div class="diff" id="diff-${rt}"></div>
      <div class="card-foot">
        <button class="approve" id="btn-${rt}">${approved ? "Re-approve with edits" : "Approve Report"}</button>
        <span class="approve-note" id="note-${rt}"></span>
      </div>
    </div>`;
}

function wireReport(rt, report) {
  const card = document.getElementById(`card-${rt}`);
  const draft = report.ai_draft || {};

  card.querySelectorAll("[data-field]").forEach(el => {
    el.addEventListener("input", () => {
      const f = el.dataset.field;
      const orig = (draft[f] === null || draft[f] === undefined) ? "" : String(draft[f]);
      if (el.value !== orig) el.classList.add("changed");
      else el.classList.remove("changed");
    });
  });

  if (report.approved && report.diff && Object.keys(report.diff).length) {
    showDiff(rt, report.diff);
  }

  document.getElementById(`btn-${rt}`).addEventListener("click", () => approve(rt));
}

function collectFields(rt) {
  const card = document.getElementById(`card-${rt}`);
  const fields = {};
  card.querySelectorAll("[data-field]").forEach(el => {
    const v = el.value.trim();
    fields[el.dataset.field] = v === "" ? null : v;
  });
  return fields;
}

async function approve(rt) {
  const btn = document.getElementById(`btn-${rt}`);
  btn.disabled = true;
  const fields = collectFields(rt);
  try {
    const res = await fetch(`/api/reports/${encodeURIComponent(incidentId)}/approve`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ report_type: rt, fields })
    });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    const report = data.report;
    document.getElementById(`pill-${rt}`).className = "pill approved";
    document.getElementById(`pill-${rt}`).textContent = "Approved";
    btn.textContent = "Re-approve with edits";
    showDiff(rt, report.diff || {});
    const n = Object.keys(report.diff || {}).length;
    document.getElementById(`note-${rt}`).textContent =
      n ? `Approved with ${n} correction${n === 1 ? "" : "s"} — fed back into the model.`
        : "Approved with no changes to the AI draft.";
    toast("Report approved and stored.");
  } catch (e) {
    toast("Approve failed: " + e.message);
  } finally {
    btn.disabled = false;
  }
}

function showDiff(rt, diff) {
  const box = document.getElementById(`diff-${rt}`);
  const keys = Object.keys(diff || {});
  if (!keys.length) { box.innerHTML = ""; return; }
  let html = `<h3>Officer corrections to the AI draft (${keys.length})</h3>`;
  for (const f of keys) {
    const d = diff[f];
    html += `<div class="diff-row">
      <div class="fname">${titleize(f)}</div>
      <div class="old">${esc(d.original === null || d.original === undefined ? "(blank)" : d.original)}</div>
      <div class="new">${esc(d.corrected === null || d.corrected === undefined ? "(blank)" : d.corrected)}</div>
    </div>`;
  }
  box.innerHTML = html;
}

load();
</script>
</body>
</html>
