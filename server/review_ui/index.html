<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Safeline Report Portal</title>
<style>
  :root {
    --bg: #f6f7f8;
    --surface: #ffffff;
    --surface-2: #eef3f4;
    --border: #d8dee3;
    --text: #1f2933;
    --muted: #65717d;
    --accent: #145c63;
    --accent-2: #0f464b;
    --green: #176b3a;
    --green-bg: #e8f5ee;
    --amber: #8a5a00;
    --amber-bg: #fff4d7;
    --red: #a83232;
    --red-bg: #fdeaea;
    --focus: #77aeb4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.45;
  }
  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .brand {
    align-items: center;
    display: flex;
    gap: 12px;
    margin: 0 auto;
    max-width: 1080px;
  }
  .logo {
    align-items: center;
    background: var(--accent);
    border-radius: 6px;
    color: #fff;
    display: flex;
    font-weight: 800;
    height: 34px;
    justify-content: center;
    width: 34px;
  }
  h1 {
    font-size: 18px;
    line-height: 1.1;
    margin: 0;
  }
  .subtitle {
    color: var(--muted);
    font-size: 12px;
    margin-top: 2px;
  }
  .wrap {
    margin: 0 auto;
    max-width: 1080px;
    padding: 24px;
  }
  .panel, .report-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .panel {
    padding: 22px;
  }
  .code-panel {
    margin: 72px auto 0;
    max-width: 520px;
  }
  .panel-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .panel-copy {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 18px;
  }
  .code-inputs {
    display: grid;
    gap: 8px;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    margin-bottom: 16px;
  }
  .code-inputs input {
    aspect-ratio: 1;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 26px;
    font-weight: 700;
    text-align: center;
    width: 100%;
  }
  .code-inputs input:focus,
  input:focus,
  textarea:focus {
    border-color: var(--focus);
    box-shadow: 0 0 0 3px rgba(119, 174, 180, .22);
    outline: none;
  }
  .actions {
    align-items: center;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  button {
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    font: inherit;
    font-weight: 700;
    min-height: 40px;
    padding: 10px 16px;
  }
  button.primary {
    background: var(--accent);
    color: #fff;
  }
  button.primary:hover { background: var(--accent-2); }
  button.secondary {
    background: var(--surface-2);
    color: var(--text);
  }
  button:disabled {
    cursor: default;
    opacity: .55;
  }
  .message {
    color: var(--muted);
    font-size: 14px;
  }
  .message.error { color: var(--red); }
  .meta {
    display: grid;
    gap: 10px;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    margin-bottom: 18px;
  }
  .meta-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
  }
  .meta-label {
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
  }
  .meta-value {
    font-size: 14px;
    margin-top: 4px;
    overflow-wrap: anywhere;
  }
  .status {
    align-items: center;
    border-radius: 8px;
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
    padding: 12px 14px;
  }
  .status.generating { background: var(--amber-bg); color: var(--amber); }
  .status.pending_review { background: var(--surface-2); color: var(--text); }
  .status.approved { background: var(--green-bg); color: var(--green); }
  .status.generation_failed,
  .status.escalated { background: var(--red-bg); color: var(--red); }
  .status-dot {
    background: currentColor;
    border-radius: 50%;
    flex: 0 0 auto;
    height: 8px;
    width: 8px;
  }
  .toolbar {
    align-items: center;
    display: flex;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 18px;
  }
  .toolbar h2 {
    font-size: 20px;
    margin: 0;
  }
  .report-card {
    margin-bottom: 18px;
    overflow: hidden;
  }
  .report-head {
    align-items: center;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    padding: 14px 16px;
  }
  .report-head h3 {
    font-size: 16px;
    margin: 0;
  }
  .pill {
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
    padding: 4px 9px;
    text-transform: uppercase;
  }
  .pill.draft { background: var(--amber-bg); color: var(--amber); }
  .pill.approved { background: var(--green-bg); color: var(--green); }
  .fields {
    padding: 6px 16px 10px;
  }
  .field {
    border-bottom: 1px solid var(--border);
    padding: 12px 0;
  }
  .field:last-child {
    border-bottom: 0;
  }
  label {
    color: var(--muted);
    display: flex;
    font-size: 13px;
    font-weight: 700;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .prio {
    color: var(--muted);
    font-size: 11px;
    font-weight: 800;
  }
  input, textarea {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font: inherit;
    padding: 9px 10px;
    width: 100%;
  }
  textarea {
    min-height: 86px;
    resize: vertical;
  }
  input.changed, textarea.changed {
    border-color: #d69d26;
  }
  .ai-original {
    color: var(--muted);
    font-size: 12px;
    margin-top: 5px;
  }
  .diff {
    border-top: 1px solid var(--border);
    padding: 12px 16px 16px;
  }
  .diff-title {
    color: var(--muted);
    font-size: 13px;
    font-weight: 800;
    margin-bottom: 8px;
  }
  .diff-row {
    background: #fafbfc;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 8px;
    padding: 8px 10px;
  }
  .diff-field { font-weight: 800; }
  .diff-old { color: var(--red); text-decoration: line-through; }
  .diff-new { color: var(--green); }
  details.transcript {
    margin-top: 18px;
  }
  details.transcript summary {
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    font-weight: 700;
  }
  details.transcript pre {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 13px;
    margin-top: 10px;
    overflow: auto;
    padding: 14px;
    white-space: pre-wrap;
  }
  .toast {
    background: var(--text);
    border-radius: 8px;
    bottom: 24px;
    color: #fff;
    font-size: 14px;
    left: 50%;
    opacity: 0;
    padding: 12px 16px;
    pointer-events: none;
    position: fixed;
    transform: translateX(-50%);
    transition: opacity .2s;
  }
  .toast.show { opacity: 1; }
  @media (max-width: 760px) {
    .wrap { padding: 18px; }
    .meta { grid-template-columns: 1fr 1fr; }
    .toolbar { align-items: stretch; flex-direction: column; }
    .toolbar .actions { width: 100%; }
    .toolbar button { flex: 1; }
  }
  @media (max-width: 460px) {
    .code-inputs { gap: 6px; }
    .code-inputs input { font-size: 22px; }
    .meta { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">S</div>
      <div>
        <h1>Safeline</h1>
        <div class="subtitle">Report Review Portal</div>
      </div>
    </div>
  </header>

  <main class="wrap" id="app"></main>
  <div class="toast" id="toast"></div>

<script>
const LONG_FIELDS = new Set([
  "narrative", "force_justification", "subject_behavior", "suspect_description",
  "disposition", "evidence", "witnesses", "property_seized", "insurance_info",
  "injuries", "injuries_officer", "injuries_subject", "medical_attention",
  "fault_determination", "vehicle_damage", "probable_cause"
]);

let activeCode = codeFromUrl();
let activeRecord = null;
let pollTimer = null;

function codeFromUrl() {
  const params = new URLSearchParams(window.location.search);
  return (params.get("code") || params.get("incident_id") || "").replace(/\D/g, "").slice(0, 6);
}

function esc(value) {
  if (value === null || value === undefined) return "";
  return String(value).replace(/[&<>"]/g, ch => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    "\"": "&quot;"
  }[ch]));
}

function titleize(value) {
  return String(value || "")
    .replace(/_/g, " ")
    .replace(/\b\w/g, ch => ch.toUpperCase());
}

function displayValue(value) {
  if (value === null || value === undefined || value === "") return "";
  return typeof value === "object" ? JSON.stringify(value) : String(value);
}

function statusLabel(status) {
  return {
    generating: "Reports generating",
    pending_review: "Pending review",
    approved: "Approved",
    generation_failed: "Generation failed",
    escalated: "Escalated"
  }[status] || titleize(status);
}

function toast(message) {
  const node = document.getElementById("toast");
  node.textContent = message;
  node.classList.add("show");
  setTimeout(() => node.classList.remove("show"), 2600);
}

function setUrlCode(code) {
  const url = new URL(window.location.href);
  url.searchParams.set("code", code);
  url.searchParams.delete("incident_id");
  window.history.replaceState({}, "", url);
}

function stopPolling() {
  if (pollTimer) {
    clearInterval(pollTimer);
    pollTimer = null;
  }
}

function startPolling() {
  stopPolling();
  pollTimer = setInterval(() => loadCode(activeCode, { silent: true }), 10000);
}

function renderCodeEntry(error = "") {
  stopPolling();
  const app = document.getElementById("app");
  app.innerHTML = `
    <section class="panel code-panel">
      <div class="panel-title">Enter report code</div>
      <p class="panel-copy">Use the six-digit code provided on the call.</p>
      <form id="code-form">
        <div class="code-inputs" aria-label="Six digit report code">
          ${Array.from({ length: 6 }, (_, i) => `
            <input inputmode="numeric" autocomplete="one-time-code"
              maxlength="1" pattern="[0-9]" data-index="${i}" aria-label="Digit ${i + 1}" />
          `).join("")}
        </div>
        <div class="actions">
          <button class="primary" type="submit">Open Reports</button>
          <span class="message error" id="code-error">${esc(error)}</span>
        </div>
      </form>
    </section>
  `;

  const form = document.getElementById("code-form");
  const inputs = [...form.querySelectorAll("input")];
  inputs[0].focus();

  inputs.forEach((input, index) => {
    input.addEventListener("input", () => {
      input.value = input.value.replace(/\D/g, "").slice(0, 1);
      if (input.value && index < inputs.length - 1) inputs[index + 1].focus();
    });
    input.addEventListener("keydown", event => {
      if (event.key === "Backspace" && !input.value && index > 0) inputs[index - 1].focus();
    });
    input.addEventListener("paste", event => {
      event.preventDefault();
      const pasted = (event.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, 6);
      pasted.split("").forEach((digit, offset) => {
        if (inputs[offset]) inputs[offset].value = digit;
      });
      inputs[Math.min(pasted.length, 5)].focus();
    });
  });

  form.addEventListener("submit", event => {
    event.preventDefault();
    const code = inputs.map(input => input.value).join("");
    if (code.length !== 6) {
      document.getElementById("code-error").textContent = "Enter all six digits.";
      return;
    }
    activeCode = code;
    setUrlCode(code);
    loadCode(code);
  });
}

async function loadCode(code, options = {}) {
  if (!code || code.length !== 6) {
    renderCodeEntry();
    return;
  }
  if (!options.silent) {
    document.getElementById("app").innerHTML = `<section class="panel">Loading report ${esc(code)}...</section>`;
  }

  try {
    const response = await fetch(`/api/reports/${encodeURIComponent(code)}`);
    if (response.status === 404) {
      renderCodeEntry("No reports were found for that code.");
      return;
    }
    if (!response.ok) throw new Error(await response.text());
    activeRecord = await response.json();
    renderRecord(activeRecord);
  } catch (error) {
    if (options.silent) return;
    renderCodeEntry(`Could not load reports: ${error.message}`);
  }
}

function renderRecord(record) {
  const app = document.getElementById("app");
  const reports = record.reports || {};
  const status = record.status || "generating";
  const generated = record.generated_at ? new Date(record.generated_at).toLocaleString() : "Not ready";

  if (status === "generating") startPolling();
  else stopPolling();

  let html = `
    <div class="toolbar">
      <h2>Report ${esc(record.access_code || activeCode)}</h2>
      <div class="actions">
        <button class="secondary" type="button" onclick="renderCodeEntry()">Use Another Code</button>
        ${Object.keys(reports).length ? '<button class="primary" id="approve-all" type="button">Approve All Reports</button>' : ""}
      </div>
    </div>
    <div class="meta">
      ${metaItem("Incident", record.incident_id || "-")}
      ${metaItem("Officer", record.officer_name || "Badge " + (record.officer_badge || "-"))}
      ${metaItem("Badge", record.officer_badge || "-")}
      ${metaItem("Generated", generated)}
    </div>
    <div class="status ${esc(status)}">
      <span class="status-dot"></span>
      <span>${esc(statusLabel(status))}</span>
    </div>
  `;

  if (status === "generating") {
    html += `
      <section class="panel">
        <div class="panel-title">Reports are still being generated.</div>
        <p class="panel-copy">This page will refresh automatically. You can also check again manually.</p>
        <button class="secondary" type="button" id="refresh-now">Check Again</button>
      </section>
    `;
    app.innerHTML = html;
    document.getElementById("refresh-now").addEventListener("click", () => loadCode(activeCode));
    return;
  }

  if (status === "generation_failed" || status === "escalated") {
    html += `
      <section class="panel">
        <div class="panel-title">${esc(statusLabel(status))}</div>
        <p class="panel-copy">${esc(record.generation_error || record.escalation_reason || "No report is available for this code.")}</p>
      </section>
    `;
    app.innerHTML = html;
    return;
  }

  if (!Object.keys(reports).length) {
    html += `<section class="panel">No report payload is available for this code.</section>`;
  }

  for (const [reportType, fields] of Object.entries(reports)) {
    html += renderReport(reportType, fields, record);
  }

  if (record.transcript) {
    html += `
      <details class="transcript">
        <summary>Source transcript</summary>
        <pre>${esc(record.transcript)}</pre>
      </details>
    `;
  }

  app.innerHTML = html;
  wireReportInputs(record);
  const approveButton = document.getElementById("approve-all");
  if (approveButton) approveButton.addEventListener("click", approveAllReports);
}

function metaItem(label, value) {
  return `
    <div class="meta-item">
      <div class="meta-label">${esc(label)}</div>
      <div class="meta-value">${esc(value)}</div>
    </div>
  `;
}

function renderReport(reportType, fields, record) {
  const template = record.report_templates?.[reportType] || [];
  const draft = record.ai_draft?.[reportType] || {};
  const approval = record.approvals?.[reportType] || {};
  const specs = template.length
    ? template
    : Object.keys(fields || {}).map(field => ({ field, label: titleize(field), priority: 2 }));
  const approved = Boolean(approval.approved);

  const fieldHtml = specs.map(spec => {
    const field = spec.field;
    const value = displayValue(fields?.[field]);
    const original = displayValue(draft?.[field]);
    const long = LONG_FIELDS.has(field) || value.length > 72;
    const inputId = `${reportType}__${field}`;
    const control = long
      ? `<textarea id="${inputId}" data-report="${reportType}" data-field="${field}" rows="3">${esc(value)}</textarea>`
      : `<input id="${inputId}" data-report="${reportType}" data-field="${field}" value="${esc(value)}" />`;
    const originalText = original ? `AI draft: ${original}` : "AI draft: not captured";

    return `
      <div class="field">
        <label for="${inputId}">
          <span>${esc(spec.label || titleize(field))}</span>
          <span class="prio">P${esc(spec.priority || 2)}</span>
        </label>
        ${control}
        <div class="ai-original">${esc(originalText)}</div>
      </div>
    `;
  }).join("");

  return `
    <section class="report-card" id="card-${reportType}">
      <div class="report-head">
        <h3>${esc(titleize(reportType))}</h3>
        <span class="pill ${approved ? "approved" : "draft"}">${approved ? "Approved" : "Draft"}</span>
      </div>
      <div class="fields">${fieldHtml}</div>
      ${renderDiff(approval.diff || {})}
    </section>
  `;
}

function renderDiff(diff) {
  const keys = Object.keys(diff || {});
  if (!keys.length) return "";
  return `
    <div class="diff">
      <div class="diff-title">Officer corrections to AI draft (${keys.length})</div>
      ${keys.map(field => `
        <div class="diff-row">
          <div class="diff-field">${esc(titleize(field))}</div>
          <div class="diff-old">${esc(displayValue(diff[field].original) || "(blank)")}</div>
          <div class="diff-new">${esc(displayValue(diff[field].corrected) || "(blank)")}</div>
        </div>
      `).join("")}
    </div>
  `;
}

function wireReportInputs(record) {
  document.querySelectorAll("[data-report][data-field]").forEach(input => {
    input.addEventListener("input", () => {
      const report = input.dataset.report;
      const field = input.dataset.field;
      const original = displayValue(record.ai_draft?.[report]?.[field]);
      input.classList.toggle("changed", input.value !== original);
    });
  });
}

function collectEditedReports() {
  const edited = {};
  document.querySelectorAll("[data-report][data-field]").forEach(input => {
    const report = input.dataset.report;
    const field = input.dataset.field;
    if (!edited[report]) edited[report] = {};
    const value = input.value.trim();
    edited[report][field] = value === "" ? null : value;
  });
  return edited;
}

async function approveAllReports() {
  const button = document.getElementById("approve-all");
  button.disabled = true;
  try {
    const response = await fetch(`/api/reports/${encodeURIComponent(activeCode)}/approve`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ edited_reports: collectEditedReports() })
    });
    if (!response.ok) throw new Error(await response.text());
    activeRecord = await response.json();
    renderRecord(activeRecord);
    toast("Reports approved and stored.");
  } catch (error) {
    toast(`Approval failed: ${error.message}`);
  } finally {
    button.disabled = false;
  }
}

if (activeCode) loadCode(activeCode);
else renderCodeEntry();
</script>
</body>
</html>
